name: daytrader

on:
  schedule:
    # Every 15 min during US market hours (13:30-20:00 UTC = 9:30a-4p ET)
    - cron: '*/15 13-20 * * 1-5'
    # End-of-day report once, ~10 min after close (20:10 UTC)
    - cron: '10 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run day-trader (scan + trade)
        run: python run.py

      - name: End-of-day report (only on the 20:10 run)
        if: github.event.schedule == '10 20 * * 1-5'
        run: python run.py eod

      - name: Commit updated state
        run: |
          git config user.name "daytrader-bot"
          git config user.email "bot@users.noreply.github.com"
          git add portfolio.json dashboard_data.js reports/ 2>/dev/null || true
          git commit -m "state update $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git pull --rebase --autostash origin main || true
          git push origin main
